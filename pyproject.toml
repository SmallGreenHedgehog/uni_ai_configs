[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uni-ai-configs"
version = "0.2.0"
description = "Prepares AI agent environment configurations from a single source of truth"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "PyYAML>=6.0",
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-bdd>=9.0",
    "polyfactory>=2.16",
]
nuitka = [
    "nuitka>=2.6",
]

[project.scripts]
build-uni-ai = "cli.commands.build:main"
init-uni-ai = "cli.commands.init:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
templates = ["*.yaml", "rules/*.md", "ignore"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py315"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "Q",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pylint.main]
load-plugins = [
    "pylint.extensions.no_self_use",
    "lint.code_style.redundant_public_method_checker",
    "lint.code_style.underscore_function_checker",
    "lint.code_style.method_order_checker",
    "lint.code_style.single_return_checker",
    "lint.architecture.layer_dependency_checker",
]
source-roots = ["."]
init-hook = 'import sys; sys.path.insert(0, "."); sys.path.insert(0, "src")'

[tool.pylint.format]
max-line-length = 120

[tool.pylint."messages control"]
disable = [
    "line-too-long", # C0301 - Ruff handles it
    "missing-module-docstring", # C0114
    "missing-class-docstring", # C0115
    "missing-function-docstring", # C0116
    "too-few-public-methods", # R0903
]
