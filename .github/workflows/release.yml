name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest

  build-linux:
    name: Build Linux x86_64 binary
    runs-on: ubuntu-latest
    needs: tests
    container: quay.io/pypa/manylinux_2_28_x86_64:latest
    env:
      TARGET_PLATFORM: linux-x86_64
      PYTHON_VERSION: 3.12.10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache baseline CPython
        id: cache-python
        uses: actions/cache@v4
        with:
          path: /opt/uni-ai-python
          key: cpython-${{ env.PYTHON_VERSION }}-manylinux_2_28-x86_64-v1

      - name: Install CPython build dependencies
        if: steps.cache-python.outputs.cache-hit != 'true'
        run: |
          yum install -y \
            openssl-devel \
            libffi-devel \
            zlib-devel \
            bzip2-devel \
            xz-devel \
            sqlite-devel \
            readline-devel \
            ncurses-devel \
            gdbm-devel \
            expat-devel \
            libuuid-devel

      - name: Build baseline CPython with shared libpython
        if: steps.cache-python.outputs.cache-hit != 'true'
        run: |
          run_quiet() {
            log_file="$1"
            shift
            if "$@" > "$log_file" 2>&1; then
              return 0
            fi
            tail -n 200 "$log_file"
            return 1
          }

          PYTHON_PREFIX="/opt/uni-ai-python"
          curl -fsSL "https://www.python.org/ftp/python/${PYTHON_VERSION}/Python-${PYTHON_VERSION}.tgz" | tar -xz
          cd "Python-${PYTHON_VERSION}"
          run_quiet /tmp/configure.log env \
            CFLAGS="-march=x86-64 -mtune=generic" \
            LDFLAGS="-Wl,-rpath,${PYTHON_PREFIX}/lib" \
            ./configure --quiet --prefix="${PYTHON_PREFIX}" --enable-shared --with-ensurepip=install
          run_quiet /tmp/build.log make -s -j"$(nproc)"
          run_quiet /tmp/install.log make -s install
          echo "CPython built and installed"

      - name: Add CPython to PATH
        run: |
          echo "/opt/uni-ai-python/bin" >> "$GITHUB_PATH"
          "/opt/uni-ai-python/bin/python3" --version

      - name: Install build dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ".[nuitka]"

      - name: Build Linux binary
        run: sh scripts/build_nuitka.sh

      - name: Verify baseline x86-64 in ELF headers
        run: |
          if readelf -n dist/uni-ai-linux-x86_64.bin | grep -q "x86-64-v3"; then
            echo "ERROR: binary requires x86-64-v3"
            exit 1
          fi

      - name: Smoke test binary
        run: ./dist/uni-ai-linux-x86_64.bin --help

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: uni-ai-linux-x86_64.bin
          path: dist/uni-ai-linux-x86_64.bin
          if-no-files-found: error

  build-macos:
    name: Build macOS arm64 binary
    runs-on: macos-15
    needs: tests
    env:
      TARGET_PLATFORM: macos-arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build dependencies
        run: pip install -e ".[nuitka]"

      - name: Build macOS binary
        run: sh scripts/build_nuitka.sh

      - name: Smoke test binary
        run: ./dist/uni-ai-macos-arm64.bin --help

      - name: Upload macOS binary
        uses: actions/upload-artifact@v4
        with:
          name: uni-ai-macos-arm64.bin
          path: dist/uni-ai-macos-arm64.bin
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-macos
    permissions:
      contents: write
    steps:
      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: uni-ai-linux-x86_64.bin
          path: dist

      - name: Download macOS binary
        uses: actions/download-artifact@v4
        with:
          name: uni-ai-macos-arm64.bin
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/uni-ai-linux-x86_64.bin
            dist/uni-ai-macos-arm64.bin
          generate_release_notes: true
