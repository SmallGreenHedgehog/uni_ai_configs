name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest

  build:
    name: Build binary
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system build dependencies
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Install build dependencies
        run: pip install -e ".[nuitka]"

      - name: Build binary
        run: sh scripts/build_nuitka.sh

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: uni-ai.bin
          path: dist/uni-ai.bin
          if-no-files-found: error
